[package]
name = "djcore"
description = "Shared DJ analysis core: key/Camelot math, audio decoding, BPM/key/beatgrid analysis."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
error-stack.workspace = true
wherror.workspace = true
serde.workspace = true
stratum-dsp.workspace = true
symphonia.workspace = true

# libopus (bundled by the adapter's default features) cannot build for
# wasm32-unknown-unknown; CI still clippy-checks that target, so the opus
# adapter is native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
symphonia-adapter-libopus.workspace = true

[dev-dependencies]
hound = { workspace = true }
serde_json.workspace = true
rstest.workspace = true
