[package]
name = "automixah-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = """
egui desktop tool for manual beat-grid alignment: Mixxx-style waveform,
grid editing, vinyl-style scrub audition, SQLite grid library.
"""

[lib]
name = "automixah_ui_lib"


[features]
__test-hooks = []

[[bin]]
name = "automixah-ui"
path = "src/main.rs"

[dependencies]
automixah-schema = { path = "../automixah-schema" }
stratum-dsp.workspace = true
djcore = { path = "../djcore" }
automixah-engine = { path = "../automixah-engine" }

eframe = "0.32"
egui = "0.32"
rfd = "0.15"
cpal = "0.16"
dirs = "6"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
async-trait = "0.1"
daow = "0.1.0"
sha2.workspace = true
error-stack.workspace = true
wherror.workspace = true
m3u = "1.0.0"
walkdir = "2"
fuzzy-matcher = "0.3"

[dev-dependencies]
rstest = "0.25"
tempfile = "3"
filetime = "0.2"
automixah_ui_lib = { path = ".", package = "automixah-ui", features = ["__test-hooks"] }

[package.metadata.cargo-shear]
ignored = []
