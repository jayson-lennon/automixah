[package]
name = "automixah-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = """
egui desktop tool for manual beat-grid alignment: Mixxx-style waveform,
grid editing, vinyl-style scrub audition, SQLite grid library.
"""

[lib]
name = "automixah_ui_lib"
path = "src/lib.rs"

[[bin]]
name = "automixah-ui"
path = "src/main.rs"

[dependencies]
automixah-schema = { path = "../automixah-schema" }
djcore = { path = "../djcore" }
automixah-engine = { path = "../automixah-engine" }

eframe = "0.32"
egui = "0.32"
rfd = "0.15"
cpal = "0.16"
dirs = "6"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
async-trait = "0.1"
daow = "0.1.0"
sha2.workspace = true
error-stack.workspace = true
wherror.workspace = true

[dev-dependencies]
tempfile = "3"
