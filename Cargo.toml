[workspace]
exclude = ["src-tauri"]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/jayson/automixah"

[workspace.dependencies]
automixah-engine = { path = "crates/automixah-engine" }
automixah-cli = { path = "crates/automixah-cli" }
error-stack = { version = "0.7.0", features = ["serde"] }
wherror = "2.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "Window",
    "Document",
    "AudioContext",
    "AudioContextOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
    "AudioNode",
    "MediaStreamAudioDestinationNode",
    "HtmlMediaElement",
    "Navigator",
    "Blob",
    "Url",
    "BlobPropertyBag",
    "MediaStream",
    "Storage",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemWritableFileStream",
    "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions",
    "FileSystemRemoveOptions",
    "DedicatedWorkerGlobalScope",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "Worker",
    "WorkerType",
    "WorkerOptions",
    "MessageEvent",
    "File",
    "FileList",
    "HtmlInputElement",
    "Event",
    "EventListener",
] }
console_error_panic_hook = "0.1"
stratum-dsp = "1.0.0"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "aac"] }
rstest = "0.24"
ron = "0.8"
criterion = "0.5"
djcore = { path = "crates/djcore" }
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
tempfile = "3"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
collapsible_if = "allow"
default_constructed_unit_structs = "allow"
doc_markdown = "allow"
enum_glob_use = "allow"
match_wildcard_for_single_variants = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
single_match = "allow"
single_match_else = "allow"
wildcard_imports = "allow"

[profile.release]
lto = true
opt-level = 3

[workspace.dependencies.tauri]
version = "2"
[workspace.dependencies.tauri-build]
version = "2"

[workspace.dependencies.sha2]
version = "0.10"
[workspace.dependencies.futures-channel]
version = "0.3"

[workspace.dependencies.futures-executor]
version = "0.3"

[patch.crates-io]
stratum-dsp = { path = "crates/stratum-dsp" }
